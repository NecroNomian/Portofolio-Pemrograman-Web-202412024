<!DOCTYPE html>
<html lang="en">

<head>

    <title>Macam Style Table Bootstrap</title>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</head>

<body>

    <div class="container mt-3">

        <h2>Table Striped</h2>

        <table class="table table-striped">

            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Kelas</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Abadi</td>
                    <td>TI A</td>
                </tr>

                <tr>
                    <td>Alvin</td>
                    <td>TI B</td>
                </tr>
            </tbody>

        </table>

        <h2>Table Bordered</h2>

        <table class="table table-bordered">

            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Kelas</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Adeel</td>
                    <td>TI C</td>
                </tr>

                <tr>
                    <td>Dani</td>
                    <td>TI D</td>
                </tr>
            </tbody>

        </table>

        <h2>Table Hover</h2>

        <table class="table table-hover">

            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Kelas</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Rama</td>
                    <td>TI E</td>
                </tr>

                <tr>
                    <td>Fikri</td>
                    <td>TI F</td>
                </tr>
            </tbody>

        </table>

        <h2>Table Dark</h2>

        <table class="table table-dark">

            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Kelas</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Nina</td>
                    <td>TI G</td>
                </tr>

                <tr>
                    <td>Salsa</td>
                    <td>TI H</td>
                </tr>
            </tbody>

        </table>

    </div>

</body>

</html>
