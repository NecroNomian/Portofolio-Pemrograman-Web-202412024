<html>

<head>

        .container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            height: 200px;
            background-color: lightgray;
        }

        .item {
            background-color: lightblue;
            padding: 25px;
            margin: 10px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="item">Box 1</div>
        <div class="item">Box 2</div>
        <div class="item">Box 3</div>
    </div>

</body>

</html>
